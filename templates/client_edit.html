{% extends "base.html" %}
{% block content %}
  <h1 class="h3 mb-3">Edit Client</h1>

  <div class="card">
    <div class="card-body">
      <form method="post">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">First name</label>
            <input class="form-control" name="first_name" value="{{ client['first_name'] }}" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Last name</label>
            <input class="form-control" name="last_name" value="{{ client['last_name'] }}" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Date of birth (MM/DD/YYYY)</label>
            <input
              class="form-control"
              name="date_of_birth"
              value="{{ to_mmddyyyy(client['date_of_birth']) }}"
              placeholder="MM/DD/YYYY"
              required
            />
          </div>
        </div>

        <div class="mt-3">
          <button class="btn btn-primary" type="submit">Save</button>
          <a class="btn btn-outline-secondary" href="{{ url_for('client_detail', client_id=client['id']) }}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
