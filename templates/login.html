<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trainer Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1c1c1c, #0b0b0b);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .login-box {
      background: #151515;
      padding: 36px 32px;
      width: 100%;
      max-width: 360px;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .login-box h2 {
      margin: 0 0 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .error {
      margin-bottom: 14px;
      color: #ff6b6b;
      font-size: 14px;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      outline: none;
      margin-bottom: 18px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background: #f59e0b;
      color: #000;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.35);
    }

    button:active {
      transform: translateY(0);
      box-shadow: none;
    }
  </style>
</head>

<body>
  <form class="login-box" method="post">
    <h2>Trainer Login</h2>

    {% with messages = get_flashed_messages(category_filter=["error"]) %}
      {% if messages %}
        <div class="error">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <input
      type="password"
      name="password"
      placeholder="Enter password"
      required
      autofocus
    />

    <button type="submit">Login</button>
  </form>
</body>
</html>
